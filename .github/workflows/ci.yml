# Continuous integration for the devtools app: lint, unit tests (Vitest), and a
# production build on every push and pull request. Catches type/build breakage
# before the cache-zip workflow ships from main — the zip is what immediately.run
# actually loads, so a broken main is a broken region for every user.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run — on a PR branch only. A push
# run gets its own group (the SHA), so it can never be cancelled by a later merge.
#
# This was `group: ci-${{ github.ref }}` with `cancel-in-progress: true`, which cancelled
# a `main` run the moment the next merge landed: the superseded commit was left with a
# CANCELLED verdict rather than a green one, which matters as soon as a check is required
# or somebody bisects `main` by check status. `cancel-in-progress: false` alone would not
# have fixed it either — GitHub keeps at most one pending run per group, so a third merge
# inside the window still cancels the middle commit's queued run. Keying push runs by SHA
# is what removes it. (R3-648 proved this on the three repos that copied this file;
# R3-653 landed the fix in file-explorer and editor, and this file was the remaining
# carrier of the old keying's cancel-a-main-run defect in this item's set — `docs`
# carries the same lines, but its CI never triggers on push, so the defect cannot
# bite there.)
#
# `workflow_dispatch` — the third trigger this workflow declares — takes the non-push arm,
# so a manual run shares the bare `ci-<ref>` group and is not cancelled in flight.
# Harmless, and named because it is the one case where the one-pending-run-per-group rule
# still applies.
concurrency:
  group: ci-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned by commit SHA (see cache.yml rationale).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run lint` is the gate: `--max-warnings 0` lives in the script, so the command
      # a contributor runs and the command CI runs are the same string (R3-656's one shape;
      # R3-653 landed it in file-explorer and editor).
      #
      # This job carried an `env: CI: true` block and the comment "ESLint and tooling
      # treat warnings as errors under CI, matching the deploy-time build gate". Both
      # halves are false — the sentence R3-653 removed in its two repos and this repo
      # kept copying. Measured here on this checkout:
      #
      #   $ CI=true npx eslint . --rule '{"max-lines":["warn",1]}'
      #   36 problems (0 errors, 36 warnings)                      → exit 0
      #   $ … --max-warnings 0                                     → exit 1
      #
      # ESLint reads no `CI` variable; Actions already sets `CI=true` in every job, so
      # the block was a no-op; and `cache.yml` — the only other workflow here — runs the
      # cache-zip publish, no lint and no build, so there was no deploy-time gate to
      # match. Three rules are warn-level here — `react-hooks/exhaustive-deps`,
      # `react-hooks/incompatible-library`, `react-hooks/unsupported-syntax`, from
      # `reactHooks.configs.flat.recommended` — so this repo was EXPOSED to the hole the
      # false comment described, not merely un-ratcheted; it is clean today (exit 0
      # above), and the script now carries the ratchet that keeps it that way.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
